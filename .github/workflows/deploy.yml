name: Deploy PWA to GitHub Pages (Release Tags)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      executar_e2e:
        description: 'Executar testes E2E Playwright antes do deploy?'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Verificar release e gerar dist de produção (release:verificar)
        run: npm run release:verificar

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato da pasta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.executar_e2e == true }}
    needs: verificar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências e Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Gerar build de produção e rodar testes E2E
        run: |
          npm run build
          npm run e2e

  deploy:
    needs: verificar
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
